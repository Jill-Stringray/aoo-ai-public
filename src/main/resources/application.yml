spring:
  application:
    name: aoo-ai
  profiles:
    active: local

server:
  port: 8080

app:
  rag:
    chunk:
      max-tokens: 500
      overlap: 80
    retrieval:
      top-k: 8
      hybrid-weight:
        vector: 0.7
        bm25: 0.3
mybatis:
  configuration:
    map-underscore-to-camel-case: true
