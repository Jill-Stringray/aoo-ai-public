spring:
  application:
    name: aoo-ai

  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

  # 主数据源：业务库（MySQL）
  datasource:
    url: jdbc:mysql://localhost:3306/aoo-ai?useSSL=false&useUnicode=true&characterEncoding=UTF-8
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat

    vectorstore:
      pgvector:
        initialize-schema: true
        # 向量库的数据源统一复用 app.datasource.pgvector 的配置
        datasource:
          url: ${app.datasource.pgvector.url}
          username: ${POSTGRES_USERNAME}
          password: ${POSTGRES_PASSWORD}
          driver-class-name: ${app.datasource.pgvector.driver-class-name}
        dimensions: 1536

spring:
  datasource-pg:
    url: jdbc:postgresql://localhost:5432/rag
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2

  rag:
    enabled: true
    top-k: 3
    docs:
      - title: "退换货政策"
        content: "7天内支持无理由退货，商品需保持完好。"
      - title: "会员权益"
        content: "会员可享受95折优惠，满200元包邮。"
      - title: "技术支持"
        content: "工作日9:00-18:00可通过在线工单联系技术支持。"
