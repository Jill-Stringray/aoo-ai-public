<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek 简易对话</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; }
        .chat-box { max-width: 800px; margin: 0 auto; }
        textarea { width: 100%; height: 120px; padding: 12px; }
        button { margin-top: 12px; padding: 8px 16px; cursor: pointer; }
        .panel { margin-top: 16px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; white-space: pre-wrap; }
        .label { font-weight: bold; margin-bottom: 8px; }
    </style>
</head>
<body>
<div class="chat-box">
    <h1>DeepSeek 简易 AI 对话</h1>
    <p>输入你的问题，点击发送即可调用后端接口。</p>

    <label for="message">你的问题：</label>
    <textarea id="message" placeholder="例如：给我一个学习 Spring Boot 的计划"></textarea>
    <br />
    <button id="sendBtn">发送</button>

    <div class="panel">
        <div class="label">AI 回复：</div>
        <div id="reply">（等待输入）</div>
    </div>
</div>

<script>
    const sendBtn = document.getElementById('sendBtn');
    const messageInput = document.getElementById('message');
    const replyEl = document.getElementById('reply');

    sendBtn.addEventListener('click', async () => {
        const message = messageInput.value.trim();
        if (!message) {
            replyEl.textContent = '请输入内容后再发送。';
            return;
        }

        replyEl.textContent = '请求中，请稍候...';

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message })
            });

            const data = await response.json();
            replyEl.textContent = data.reply || '未收到回复';
        } catch (error) {
            replyEl.textContent = '请求失败：' + error.message;
        }
    });
</script>
</body>
</html>
