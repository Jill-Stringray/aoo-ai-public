server:
  port: 8080


spring:
  application:
    name: aoo-gateway

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848

    gateway:
      routes:
        - id: aoo-ai-service
          uri: lb://aoo-ai-service
          predicates:
            - Path=/api/v1/**


logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG